<script>
        // Simple logic to remove splash screen from DOM after animation completes to free up interactions
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.display = 'none';
                }
            }, 3000); // Wait for fade out animation (2s delay + 1s duration)
        });
    </script>
