<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 backdrop-blur-xl bg-surface/70 shadow-sm transition-colors duration-300">
<div class="flex items-center justify-between px-margin py-md w-full max-w-[1440px] mx-auto">
<button class="text-on-surface-variant hover:bg-surface-container-high/50 active:scale-95 duration-100 transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary tracking-tight">
                NIT Silchar Helpdesk
            </h1>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/30 hover:bg-surface-container-high/50 transition-colors cursor-pointer active:scale-95 duration-100">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A professional headshot of a university student or staff member in a bright, modern indoor setting, slightly blurred background, high quality portrait, well lit." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuSGLNKcEVbBIJPx_2ME5WyGbchOqNZKOp8EWnQ21snHAF9E_w9_-ylV5FA0cwAMs1EX7ZQZQsfO8Eey3_F4YOy8a40IAxL-UslvnWMgThNlIPfn1xxpFn28T-lqR_ubXdpaTtz3SCj5G-2TZltgs9y07p4dXOOV_DE5Ni6cWDe36-UHTIV9WPejmEB6P6HJ3Ln5ya2LLx5aHaGaclf9RvB3dPyj45pennW1T7fpOBcsuOrvRc8_v1"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[1440px] mx-auto px-4 md:px-margin py-xl pb-24 md:pb-xl flex justify-center">
<!-- Glassmorphism Form Container -->
<div class="w-full max-w-2xl bg-surface/80 backdrop-blur-md rounded-[24px] border border-outline-variant/40 shadow-[0_8px_32px_rgba(0,0,0,0.04)] overflow-hidden relative">
<!-- Decorative Header Gradient -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
<div class="p-lg md:p-xl">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Report an Issue</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide details about the problem you're experiencing.</p>
</div>
<form class="space-y-lg flex flex-col">
<!-- Multi-step Indicator (Visual Only) -->
<div class="flex items-center justify-between mb-8 relative before:content-[''] before:absolute before:top-1/2 before:left-0 before:w-full before:h-[2px] before:bg-surface-container-high before:-z-10">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-md text-title-md shadow-sm">1</div>
<span class="font-label-sm text-label-sm text-primary mt-2">Details</span>
</div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-title-md text-title-md">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Media</span>
</div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-title-md text-title-md">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Review</span>
</div>
</div>
<!-- Title -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="complaint-title">Title</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/70" id="complaint-title" placeholder="Brief summary of the issue" type="text"/>
</div>
<!-- Department & Category (Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="department">Department</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all cursor-pointer" id="department">
<option disabled="" selected="" value="">Select Department</option>
<option value="it">IT &amp; Network</option>
<option value="estate">Estate &amp; Maintenance</option>
<option value="hostel">Hostel Management</option>
<option value="academic">Academic Section</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="category">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all cursor-pointer" id="category">
<option disabled="" selected="" value="">Select Category</option>
<option value="wifi">WiFi / Internet</option>
<option value="plumbing">Plumbing</option>
<option value="electrical">Electrical</option>
<option value="cleaning">Cleaning</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Location -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="location">Location</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="location_on">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline/70" id="location" placeholder="e.g. Hostel 8, Room 204 or CCC Lab 2" type="text"/>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="description">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all resize-none placeholder:text-outline/70" id="description" placeholder="Provide detailed information about the issue..." rows="4"></textarea>
</div>
<!-- Priority (Chips) -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Priority</label>
<div class="flex flex-wrap gap-sm mt-1">
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-title-md text-title-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent transition-all hover:bg-surface-container-highest">
                                    Low
                                </div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="medium"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-title-md text-title-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-transparent transition-all hover:bg-surface-container-highest">
                                    Medium
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-title-md text-title-md peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:border-transparent transition-all hover:bg-surface-container-highest">
                                    High
                                </div>
</label>
</div>
</div>
<!-- Upload Photos -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Attachments</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-md mt-1">
<!-- Upload Card -->
<button class="aspect-square rounded-xl border-2 border-dashed border-outline-variant/60 flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low hover:border-primary/50 transition-all text-on-surface-variant hover:text-primary group" type="button">
<span class="material-symbols-outlined text-[32px] mb-2 group-hover:scale-110 transition-transform" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-sm text-label-sm">Add Photo</span>
</button>
<!-- Placeholder for uploaded image -->
<div class="aspect-square rounded-xl bg-surface-container border border-outline-variant/30 overflow-hidden relative group hidden">
<img alt="uploaded preview" class="w-full h-full object-cover" data-alt="A placeholder image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsOJ39diAc3qlvfHJrceYzKABTEWpDvU4ODINdHU72DaKx57wuznDmU4Cxs4NiTr9Z7r_dZZfVs14zGQlmFJMQX-JHn4QrG28c4mMZi8ppZVC3mEh6qAzkACVno9ZuB4m6_RG8Lh4oEmwBJi7lNp421mRjfAIhsVE0p_gXej81Bx4WrI8mhROFjKLmo5Sk9gn-K5y8w9q27JfhuLjtN-s_kTCl4OMD3BVBAR2GZ26S3F4iaOzRkfiO"/>
<button class="absolute top-2 right-2 w-6 h-6 bg-inverse-surface/70 rounded-full flex items-center justify-center text-inverse-on-surface opacity-0 group-hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
<!-- Anonymous Toggle -->
<div class="flex items-center justify-between p-4 rounded-xl border border-outline-variant/40 bg-surface-container-low mt-sm">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Submit Anonymously</span>
<span class="font-body-md text-body-md text-on-surface-variant">Hide identity from resolving staff</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-outline after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Submit Button -->
<div class="pt-md mt-md border-t border-outline-variant/20">
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-md text-title-md py-4 rounded-xl shadow-[0_4px_12px_rgba(0,53,95,0.2)] transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Submit Complaint</span>
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</div>
</form>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container border-t border-outline-variant/30 shadow-[0px_-4px_12px_rgba(0,0,0,0.05)]">
<div class="flex justify-around items-center h-16 px-4 pb-safe w-full">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1 icon-fill" data-icon="assignment_late">assignment_late</span>
<span class="font-label-sm text-label-sm">Complaints</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="notifications">notifications</span>
<span class="font-label-sm text-label-sm">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</div>
</nav>
<!-- Desktop Navigation Overlay (Hidden on Mobile) -->
<!-- Not rendering full desktop sidenav per instructions to focus on single page layout, 
         TopAppBar serves as global nav anchor. -->
</body></html>
